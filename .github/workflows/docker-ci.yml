name: Docker CI

on:
    push:
        branches: [main]
        paths:
            - "apps/web/**"
            - "packages/**"
            - "pnpm-lock.yaml"
            - "pnpm-workspace.yaml"
            - "package.json"
            - ".dockerignore"
            - "docker-compose.yml"
            - ".github/workflows/docker-ci.yml"
    pull_request:
        branches: [main]
        paths:
            - "apps/web/**"
            - "packages/**"
            - "pnpm-lock.yaml"
            - "pnpm-workspace.yaml"
            - "package.json"
            - ".dockerignore"
            - "docker-compose.yml"
            - ".github/workflows/docker-ci.yml"

jobs:
    web-image:
        runs-on: ubuntu-latest
        timeout-minutes: 20

        steps:
            - uses: actions/checkout@v7

            - uses: docker/setup-buildx-action@v4

            - name: Build web image
              uses: docker/build-push-action@v7
              with:
                  context: .
                  file: apps/web/Dockerfile
                  load: true
                  push: false
                  tags: avrash-web:ci
                  cache-from: type=gha,scope=web-image
                  cache-to: type=gha,scope=web-image,mode=max

            - name: Start container
              run: docker run -d --name web -p 3000:3000 avrash-web:ci

            - name: Wait for a healthy container
              run: |
                  for attempt in $(seq 1 30); do
                      status=$(docker inspect -f '{{.State.Health.Status}}' web)
                      [ "$status" = "healthy" ] && exit 0
                      sleep 2
                  done
                  docker logs web
                  exit 1

            - name: Smoke test routes
              run: |
                  check() {
                      code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:3000$1")
                      echo "$1 -> $code"
                      [ "$code" = "$2" ]
                  }
                  check /en 200
                  check /pl/works 200
                  check /en/contact 200
                  check /en/legal/privacy 200
                  check /sitemap.xml 200
                  check /api/projects 200
                  check "/_next/image?url=%2Fog%2Fcover.jpg&w=640&q=75" 200
                  [ "$(docker exec web id -u)" = "1001" ]

            - name: Container logs
              if: always()
              run: docker logs web || true
