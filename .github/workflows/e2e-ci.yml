name: E2E CI

on:
    push:
        branches: [main]
        paths:
            - "apps/web/**"
            - "apps/admin/**"
            - "packages/ui/**"
            - "packages/content-schema/**"
            - "packages/content-data/**"
            - "e2e/**"
            - "pnpm-lock.yaml"
            - "pnpm-workspace.yaml"
            - "package.json"
            - ".github/workflows/e2e-ci.yml"
    pull_request:
        branches: [main]
        paths:
            - "apps/web/**"
            - "apps/admin/**"
            - "packages/ui/**"
            - "packages/content-schema/**"
            - "packages/content-data/**"
            - "e2e/**"
            - "pnpm-lock.yaml"
            - "pnpm-workspace.yaml"
            - "package.json"
            - ".github/workflows/e2e-ci.yml"

jobs:
    e2e:
        name: e2e (${{ matrix.name }})
        runs-on: ubuntu-latest
        timeout-minutes: 30

        strategy:
            fail-fast: false
            matrix:
                include:
                    - name: web 1/2
                      project: web
                      shard: 1/2
                      apps: web
                      browser: chromium
                    - name: web 2/2
                      project: web
                      shard: 2/2
                      apps: web
                      browser: chromium
                    - name: web-ios
                      project: web-ios
                      apps: web
                      browser: webkit
                    - name: web-webkit
                      project: web-webkit
                      apps: web
                      browser: webkit
                    - name: admin
                      project: admin
                      apps: admin
                      browser: chromium

        env:
            E2E_SERVER: production
            E2E_APPS: ${{ matrix.apps }}

        steps:
            - uses: actions/checkout@v7

            - uses: pnpm/action-setup@v6

            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: "pnpm"

            - run: pnpm install --frozen-lockfile

            - name: Cache Playwright browsers
              id: playwright-cache
              uses: actions/cache@v6
              with:
                  path: ~/.cache/ms-playwright
                  key: ${{ runner.os }}-playwright-${{ matrix.browser }}-${{ hashFiles('pnpm-lock.yaml') }}

            - name: Install Playwright browser (+ OS deps)
              if: steps.playwright-cache.outputs.cache-hit != 'true'
              run: pnpm --filter @avrash/e2e exec playwright install --with-deps ${{ matrix.browser }}

            - name: Install Playwright's OS dependencies only
              if: steps.playwright-cache.outputs.cache-hit == 'true'
              run: pnpm --filter @avrash/e2e exec playwright install-deps ${{ matrix.browser }}

            - name: Run E2E against a production build
              run: >-
                  pnpm --filter @avrash/e2e exec playwright test
                  --project=${{ matrix.project }}
                  ${{ matrix.shard && format('--shard={0}', matrix.shard) || '' }}

            - name: Upload Playwright report
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: playwright-report-${{ matrix.project }}${{ matrix.shard && format('-{0}', strategy.job-index) || '' }}
                  path: e2e/playwright-report/
