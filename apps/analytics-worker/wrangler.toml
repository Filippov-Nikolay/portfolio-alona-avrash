name = "avrash-analytics-worker"
main = "src/index.ts"
compatibility_date = "2026-09-19"

# Enforced server-side (src/security.ts's isAllowedOrigin), not just echoed
# in the CORS response header - a request whose Origin doesn't match this
# gets a 403. Set to the public site's real origin before deploying.
[vars]
ALLOWED_ORIGIN = "https://dev.avrash.com"

# ANALYTICS_READ_SECRET (the bearer token admin's GET /analytics/* reads
# authenticate with) is NOT set here - this file is committed. Set it with:
#   wrangler secret put ANALYTICS_READ_SECRET
# Give apps/admin this exact same value as its ANALYTICS_READ_SECRET env var.

# Created once with: wrangler d1 create avrash-analytics
# Then paste the printed database_id below, and run migrations with:
#   wrangler d1 migrations apply avrash-analytics --local   (dev)
#   wrangler d1 migrations apply avrash-analytics --remote  (production)
[[d1_databases]]
binding = "DB"
database_name = "avrash-analytics-dev"
database_id = "d4fad309-f0c3-4c81-a83c-360ab929fa92"
migrations_dir = "migrations"

# Uncomment once a route is ready to receive traffic - see README.md.
[[routes]]
pattern = "analytics-dev.avrash.com"
custom_domain = true
